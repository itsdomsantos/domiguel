<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Metal+Mania&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0a0a0d;
        --surface: #131318;
        --line: #26262e;
        --text: #ededf0;
        --muted: #9a9aa6;
        --accent: #e04e20;      /* flame red */
        --chrome-hi: #f6f6f9;
        --chrome-mid: #bcbfc9;
        --chrome-lo: #6e7280;
        --chrome: linear-gradient(180deg, #f6f6f9 0%, #bcbfc9 52%, #6e7280 100%);
        --flame: linear-gradient(180deg, #ff8a3d 0%, #e04e20 55%, #b5210b 100%);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1350px; }
      .slide {
        position: relative;
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        background:
          radial-gradient(900px circle at 50% -8%, rgba(198, 202, 214, 0.10), transparent 55%),
          radial-gradient(820px circle at 82% 108%, rgba(224, 78, 32, 0.30), transparent 55%),
          radial-gradient(1200px circle at 50% 55%, #101015 0%, #0a0a0d 72%);
        font-family: 'Archivo', system-ui, sans-serif;
        color: var(--text);
        padding: 92px 88px;
        display: flex;
        flex-direction: column;
      }
      /* film grain */
      .grain {
        position: absolute; inset: 0; pointer-events: none; opacity: 0.05; z-index: 3;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
      }
      .vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 2;
        background: radial-gradient(circle at 50% 40%, transparent 58%, rgba(0,0,0,0.55) 100%);
      }
      /* metallic top sheen line */
      .sheen { position: absolute; top: 0; left: 0; right: 0; height: 3px;
        background: linear-gradient(90deg, transparent, rgba(246,246,249,0.5), transparent); z-index: 2; }

      .top { display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 4; }
      .brand { font-family: 'Metal Mania', serif; font-size: 40px; letter-spacing: 0.02em;
        background: var(--chrome); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .index { font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 26px; color: var(--muted); letter-spacing: 0.14em; }

      .body { flex: 1; display: flex; flex-direction: column; justify-content: center; position: relative; z-index: 4; }

      .kicker {
        display: inline-flex; align-items: center; gap: 12px; align-self: flex-start;
        font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: 0.22em;
        text-transform: uppercase; color: #ff7a4d;
        padding: 12px 22px; border: 1px solid rgba(224,78,32,0.45); border-radius: 999px;
        background: rgba(224,78,32,0.08); margin-bottom: 46px;
      }
      .kicker .pip { width: 12px; height: 12px; border-radius: 50%; background: var(--flame); box-shadow: 0 0 18px rgba(224,78,32,0.9); }

      .wordmark {
        font-family: 'Metal Mania', serif;
        font-size: 150px; line-height: 0.98; letter-spacing: 0.01em; white-space: nowrap;
        background: var(--chrome); -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(0 8px 2px rgba(0,0,0,0.6)) drop-shadow(0 26px 60px rgba(224,78,32,0.28));
        margin-bottom: 8px;
      }
      .rule { width: 180px; height: 6px; border-radius: 6px; background: var(--flame); margin: 22px 0 34px; box-shadow: 0 0 26px rgba(224,78,32,0.6); }

      h2 { font-family: 'Archivo', sans-serif; font-weight: 900; line-height: 1.03; letter-spacing: -0.02em; font-size: 84px; margin-bottom: 34px; text-transform: uppercase; }
      h2 .chrome { background: var(--chrome); -webkit-background-clip: text; background-clip: text; color: transparent; }
      h2 .flame { background: var(--flame); -webkit-background-clip: text; background-clip: text; color: transparent; }

      .lead { font-size: 39px; line-height: 1.46; color: #c6c6d0; font-weight: 500; max-width: 850px; }
      .lead strong { color: var(--text); font-weight: 800; }

      .tag { font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 30px; color: var(--muted); margin-top: 40px; letter-spacing: 0.02em; }

      .eras { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 44px; }
      .era { font-family:'Archivo',sans-serif; font-weight: 800; font-size: 30px; padding: 12px 24px; border-radius: 999px;
        border: 1px solid var(--line); background: rgba(255,255,255,0.03); color: #d7d7de; }

      .list { display: flex; flex-direction: column; gap: 30px; margin-top: 6px; }
      .item { display: flex; align-items: center; gap: 26px; font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 48px; }
      .item .bar { width: 8px; height: 50px; border-radius: 6px; background: var(--flame); box-shadow: 0 0 20px rgba(224,78,32,0.5); }
      .item .sm { display: block; font-weight: 600; font-size: 27px; color: var(--muted); margin-top: 4px; letter-spacing: 0.01em; }

      .foot { display: flex; align-items: flex-end; justify-content: space-between; position: relative; z-index: 4; }
      .dots { display: flex; gap: 12px; align-items: center; }
      .d { width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,0.18); }
      .d.on { background: var(--flame); width: 40px; }
      .swipe { font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 30px; color: #c6c6d0; display: flex; align-items: center; gap: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
      .swipe .ar { color: var(--accent); }
      .cta { text-align: right; }
      .cta .go { font-family: 'Archivo', sans-serif; font-weight: 900; font-size: 40px; }
      .cta .go .flame { background: var(--flame); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .cta .url { font-weight: 700; font-size: 30px; color: var(--muted); }
      .credit { font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 26px; color: var(--muted); }
      .credit b { color: #e7e7ee; }
      .credit .dot { color: #7c5cff; }
    </style>
  </head>
  <body>
    <div class="slide">
      <div class="sheen"></div>
      <div class="top">
        <div class="brand">GAGAFLIX</div>
        <div class="index" id="index">01 / 03</div>
      </div>
      <div class="body" id="body"></div>
      <div class="foot">
        <div class="dots" id="dots"></div>
        <div id="footright"></div>
      </div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>
  </body>
</html>
