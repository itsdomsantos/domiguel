<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #07070d;
        --text: #f4f4fa;
        --brand: #7c5cff;
        --brand-2: #00d4ff;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1080px; }
      .canvas {
        position: relative;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background:
          radial-gradient(680px circle at 22% 16%, rgba(124, 92, 255, 0.42), transparent 55%),
          radial-gradient(720px circle at 82% 86%, rgba(0, 212, 255, 0.32), transparent 55%),
          radial-gradient(900px circle at 50% 50%, #0e0e1c 0%, #07070d 70%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Sora', system-ui, sans-serif;
      }
      /* faint framing ring, safe inside the circular IG crop */
      .ring {
        position: absolute;
        inset: 96px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.06);
        box-shadow:
          inset 0 0 120px rgba(124, 92, 255, 0.12),
          inset 0 0 60px rgba(0, 212, 255, 0.08);
      }
      /* subtle vignette for depth */
      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 50%, transparent 55%, rgba(0, 0, 0, 0.45) 100%);
        pointer-events: none;
      }
      .mark {
        position: relative;
        display: flex;
        align-items: baseline;
        font-weight: 800;
        letter-spacing: -0.045em;
        line-height: 1;
        z-index: 2;
        filter: drop-shadow(0 18px 60px rgba(124, 92, 255, 0.35));
      }
      .mark .word {
        color: var(--text);
      }
      .mark .dot,
      .mark .suffix {
        background: linear-gradient(135deg, #9a7bff 0%, #00d4ff 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: var(--brand-2);
      }
      /* subtle glow puck behind the mark */
      .glow {
        position: absolute;
        width: 640px;
        height: 640px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(124, 92, 255, 0.28), transparent 62%);
        filter: blur(20px);
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="ring"></div>
      <div class="glow"></div>
      <div class="mark" id="mark"></div>
      <div class="vignette"></div>
    </div>
  </body>
</html>
