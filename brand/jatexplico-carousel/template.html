<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dosis:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --tinta: #002855;
        --tinta-2: #0A3D70;
        --marcador: #EF3340;
        --giz: #A1D884;
        --lapis: #5BC2E7;
        --papel: #F3F7FA;
        --papel-2: #E4EEF4;
        --display: 'Dosis', system-ui, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1350px; }
      .slide {
        position: relative;
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        background: var(--papel);
        font-family: var(--display);
        color: var(--tinta);
        padding: 92px 88px;
        display: flex;
        flex-direction: column;
      }
      /* notebook dotted grid */
      .grid {
        position: absolute; inset: 0; pointer-events: none; z-index: 0; opacity: 0.5;
        background-image: radial-gradient(rgba(0,40,85,0.10) 2.2px, transparent 2.3px);
        background-size: 46px 46px;
      }
      /* soft colour blobs */
      .blob { position: absolute; border-radius: 50%; filter: blur(10px); z-index: 0; opacity: 0.5; }
      .blob-a { width: 420px; height: 420px; top: -120px; right: -120px; background: radial-gradient(circle, rgba(91,194,231,0.55), transparent 65%); }
      .blob-b { width: 460px; height: 460px; bottom: -160px; left: -140px; background: radial-gradient(circle, rgba(161,216,132,0.5), transparent 65%); }

      .top { display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 2; }
      .logo-badge {
        display: inline-flex; align-items: center; justify-content: center;
        background: #fff; border-radius: 24px; padding: 14px 18px;
        box-shadow: 0 18px 40px -20px rgba(0,40,85,0.35); border: 1px solid rgba(0,40,85,0.06);
      }
      .logo-badge img { display: block; height: 96px; width: auto; }
      .index { font-family: var(--display); font-weight: 700; font-size: 27px; color: var(--tinta-2); opacity: 0.7; letter-spacing: 0.08em; }

      .body { flex: 1; display: flex; flex-direction: column; justify-content: center; position: relative; z-index: 2; }

      .eyebrow {
        display: inline-flex; align-items: center; gap: 12px; align-self: flex-start;
        font-family: var(--display); font-weight: 800; font-size: 25px; letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--marcador);
        padding: 12px 24px; border-radius: 999px; background: rgba(239,51,64,0.10);
        margin-bottom: 44px;
      }
      .eyebrow .pip { width: 12px; height: 12px; border-radius: 50%; background: var(--marcador); }

      h1 { font-family: var(--display); font-weight: 800; line-height: 1.08; letter-spacing: -0.01em; font-size: 96px; }
      h2 { font-family: var(--display); font-weight: 800; line-height: 1.1; letter-spacing: -0.01em; font-size: 78px; margin-bottom: 34px; }

      /* hand-drawn underline */
      .mark { position: relative; display: inline-block; }
      .mark svg { position: absolute; left: -3%; bottom: -0.2em; width: 106%; height: 0.42em; overflow: visible; }
      .mark path { fill: none; stroke: var(--lapis); stroke-width: 11; stroke-linecap: round; }
      .mark--red path { stroke: var(--marcador); }
      .mark--green path { stroke: var(--giz); }

      .lead { font-family: var(--display); font-size: 40px; line-height: 1.42; color: var(--tinta-2); font-weight: 500; max-width: 860px; margin-top: 40px; }
      .lead strong { color: var(--tinta); font-weight: 800; }

      .chip { display: inline-flex; align-items: center; gap: 14px; margin-top: 44px; align-self: flex-start;
        font-family: var(--display); font-weight: 700; font-size: 30px; color: var(--tinta);
        padding: 16px 26px; border-radius: 18px; background: #fff; border: 2px solid var(--papel-2);
        box-shadow: 0 18px 40px -22px rgba(0,40,85,0.35); }
      .chip .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--giz); }

      .list { display: flex; flex-direction: column; gap: 26px; margin-top: 6px; }
      .item { display: flex; align-items: center; gap: 26px; background: #fff; border: 2px solid var(--papel-2);
        border-radius: 22px; padding: 30px 34px; box-shadow: 0 20px 44px -26px rgba(0,40,85,0.4); }
      .item .num { flex: none; width: 74px; height: 74px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
        font-family: var(--display); font-weight: 800; font-size: 40px; color: #fff; }
      .item .t { font-family: var(--display); font-weight: 800; font-size: 46px; line-height: 1.05; }
      .item .s { display: block; font-weight: 600; font-size: 27px; color: var(--tinta-2); opacity: 0.8; margin-top: 2px; }

      .foot { display: flex; align-items: flex-end; justify-content: space-between; position: relative; z-index: 2; }
      .dots { display: flex; gap: 12px; align-items: center; }
      .d { width: 14px; height: 14px; border-radius: 50%; background: rgba(0,40,85,0.18); }
      .d.on { background: var(--marcador); width: 40px; }
      .swipe { font-family: var(--display); font-weight: 800; font-size: 31px; color: var(--tinta); display: flex; align-items: center; gap: 12px; }
      .swipe .ar { color: var(--marcador); }
      .cta { text-align: right; }
      .cta .site { font-family: var(--display); font-weight: 800; font-size: 42px; color: var(--tinta); }
      .cta .handle { font-family: var(--display); font-weight: 700; font-size: 30px; color: var(--tinta-2); opacity: 0.85; }
      .credit { font-family: var(--display); font-weight: 700; font-size: 25px; color: var(--tinta-2); opacity: 0.85; }
      .credit b { color: var(--tinta); }
      .credit .dot { color: #7c5cff; }
    </style>
  </head>
  <body>
    <div class="slide">
      <div class="grid"></div>
      <div class="blob blob-a"></div>
      <div class="blob blob-b"></div>
      <div class="top">
        <div class="logo-badge"><img id="logo" alt="Já T'Explico" /></div>
        <div class="index" id="index">01 / 03</div>
      </div>
      <div class="body" id="body"></div>
      <div class="foot">
        <div class="dots" id="dots"></div>
        <div id="footright"></div>
      </div>
    </div>
  </body>
</html>
