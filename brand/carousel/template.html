<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #07070d;
        --text: #f4f4fa;
        --text-soft: #a9a9c0;
        --text-dim: #6c6c82;
        --brand: #7c5cff;
        --brand-2: #00d4ff;
        --grad: linear-gradient(135deg, #9a7bff 0%, #00d4ff 100%);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1350px; }
      .slide {
        position: relative;
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        background:
          radial-gradient(760px circle at 18% 12%, rgba(124, 92, 255, 0.38), transparent 55%),
          radial-gradient(820px circle at 88% 92%, rgba(0, 212, 255, 0.30), transparent 55%),
          radial-gradient(1100px circle at 50% 45%, #0e0e1c 0%, #07070d 72%);
        font-family: 'Inter', system-ui, sans-serif;
        color: var(--text);
        padding: 96px 92px;
        display: flex;
        flex-direction: column;
      }
      .vignette {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(circle at 50% 42%, transparent 60%, rgba(0,0,0,0.5) 100%);
      }
      /* top bar */
      .top {
        display: flex; align-items: center; justify-content: space-between;
        position: relative; z-index: 2;
      }
      .logo {
        font-family: 'Sora', sans-serif; font-weight: 800; font-size: 40px; letter-spacing: -0.04em;
      }
      .logo .dot { background: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
      .logo .muted { color: var(--text-dim); font-weight: 600; font-size: 30px; }
      .index { font-family: 'Sora', sans-serif; font-weight: 600; font-size: 26px; color: var(--text-dim); letter-spacing: 0.05em; }

      /* main content */
      .body { flex: 1; display: flex; flex-direction: column; justify-content: center; position: relative; z-index: 2; }
      .eyebrow {
        display: inline-flex; align-items: center; gap: 10px; align-self: flex-start;
        font-family: 'Sora', sans-serif; font-weight: 600; font-size: 26px; letter-spacing: 0.14em;
        text-transform: uppercase; color: var(--brand-2);
        padding: 12px 22px; border: 1px solid rgba(255,255,255,0.12); border-radius: 999px;
        background: rgba(255,255,255,0.03); margin-bottom: 44px;
      }
      h1 {
        font-family: 'Sora', sans-serif; font-weight: 800; line-height: 1.02;
        letter-spacing: -0.03em; font-size: 132px; margin-bottom: 40px;
      }
      h2 {
        font-family: 'Sora', sans-serif; font-weight: 800; line-height: 1.06;
        letter-spacing: -0.02em; font-size: 82px; margin-bottom: 36px;
      }
      .grad { background: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
      .lead { font-size: 40px; line-height: 1.45; color: var(--text-soft); font-weight: 400; max-width: 820px; }
      .lead strong { color: var(--text); font-weight: 600; }

      .list { display: flex; flex-direction: column; gap: 26px; margin-top: 12px; }
      .item { display: flex; align-items: center; gap: 24px; font-family: 'Sora', sans-serif; font-weight: 600; font-size: 46px; }
      .item .ic { font-size: 42px; }
      .item .bar { width: 8px; height: 46px; border-radius: 6px; background: var(--grad); }

      /* footer */
      .foot { display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 2; }
      .dots { display: flex; gap: 12px; }
      .d { width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,0.18); }
      .d.on { background: var(--grad); width: 40px; }
      .swipe { font-family: 'Sora', sans-serif; font-weight: 600; font-size: 30px; color: var(--text-soft); display: flex; align-items: center; gap: 12px; }
      .cta { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 34px; }
      .cta .grad { font-weight: 700; }
      .contact { font-size: 30px; color: var(--text-soft); }
    </style>
  </head>
  <body>
    <div class="slide">
      <div class="top">
        <div class="logo"><span>Dom</span><span class="dot">.</span> <span class="muted">Developments</span></div>
        <div class="index" id="index">01 / 03</div>
      </div>

      <div class="body" id="body"></div>

      <div class="foot">
        <div class="dots" id="dots"></div>
        <div id="footright"></div>
      </div>

      <div class="vignette"></div>
    </div>
  </body>
</html>
